# Copy this into a tool repository as `.github/workflows/notify-hub-release.yml`.
#
# It tells the toolkit hub that a release was published, so the hub's catalog is
# rebuilt within a minute or two instead of waiting for the nightly schedule.
#
# This is the sending half of `.github/workflows/catalog.yml` in
# `hero-siege-offline-toolkit`. The receiving side validates the sender against
# an allowlist and opens a pull request rather than pushing, so firing this event
# cannot move the hub repository's default branch.
#
# Why this is a separate file from `notify-hub.example.yml`: that template sends
# `submodule-pointer-bump` when a commit lands, and lives on a branch that has
# not merged yet. Keeping the two apart means a repository can install either,
# both, or neither. If you already have `notify-hub.yml`, add the job below to
# it rather than keeping two workflows.
#
# Setup, once per tool repository:
#
#   1. Create a fine-grained personal access token with
#      `Contents: read` on the hub repository — nothing else. A
#      `repository_dispatch` needs no more than that.
#   2. Add it as the repository secret `HUB_DISPATCH_TOKEN`.
#   3. Commit this file.
#
# Publishing a release with no token set simply does nothing: the step is
# skipped, and the hub's nightly schedule picks the release up anyway. The
# notification is a latency improvement, never a requirement.

name: Notify hub of a release

on:
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    # A draft becoming a release fires `published`; a prerelease is not
    # something the catalog should switch users onto.
    if: github.event.release.prerelease == false
    steps:
      - name: Tell the hub
        env:
          TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "HUB_DISPATCH_TOKEN is not set; the hub will pick this release \
          up on its next scheduled catalog build."
            exit 0
          fi

          # The payload carries only what the receiving workflow reads. It does
          # not carry the asset list or the version: the hub resolves those from
          # the GitHub API itself, so a forged payload cannot talk it into
          # pinning an artifact that is not on the release.
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/falorfrozen-cmd/hero-siege-offline-toolkit/dispatches \
            -d "$(jq -nc \
                  --arg repo "$GITHUB_REPOSITORY" \
                  --arg tag "$GITHUB_REF_NAME" \
                  '{event_type: "release-published",
                    client_payload: {repository: $repo, tag: $tag}}')"
