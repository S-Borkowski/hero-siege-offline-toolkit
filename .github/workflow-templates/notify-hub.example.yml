# Template — copy this file into a tool repository as
# `.github/workflows/notify-hub.yml`. It does not run here in the hub; the hub
# only has the receiving side (`.github/workflows/submodule-dispatch.yml`).
#
# The hub records each tool as a submodule pinned to a fixed commit, and
# nothing moves that pin on its own. Without this workflow the hub keeps
# shipping an older copy of the tool until somebody bumps the pointer by hand.
# With it, a push to the tool's default branch fires a `repository_dispatch` of
# type `submodule-updated` at the hub.
#
# The receiving side validates the payload against an allowlist of submodule
# paths, checks the SHA is 40 hex characters, and then opens a pull request
# rather than pushing — so firing this event cannot move the hub repository's
# default branch. A human still merges the bump.
#
# Setup, once per tool repository:
#
#   1. Replace `<submodule-path>` below with this repository's path exactly as
#      it appears in the hub's `.gitmodules` (case-sensitive), e.g.
#      `ForgePact`. That exact string is what the receiver's allowlist checks.
#   2. Check the branch in `on.push.branches` against this repository's default
#      branch. Most are `main`, but `hero-siege-item-editor` is `master`, and a
#      workflow keyed to the wrong branch simply never fires.
#   3. Add a repository secret named exactly `HUB_DISPATCH_TOKEN`, under
#      Settings > Secrets and variables > Actions > New repository secret in
#      THIS repository. Its value is a token scoped to the HUB repository:
#      a fine-grained token whose resource owner is the hub's owner, whose
#      repository access is only `hero-siege-offline-toolkit`, and whose only
#      permission is `Contents: Read and write`. (A classic token needs the
#      `repo` scope, which is broader than necessary.)
#
#      `Contents: Read and write` is not a typo. `POST /repos/{owner}/{repo}/
#      dispatches` is documented under Contents *write*; a read-only token
#      gets 403 "Resource not accessible by personal access token".
#
#      The token needs no access to this repository at all — the secret is
#      stored here but spends its permission on the hub. The default
#      `GITHUB_TOKEN` cannot dispatch across repositories, so there is no way
#      around a separate secret here. The same token can be reused as the
#      secret in every tool repository.
#
# Steps 1 and 2 are required before this is worth installing. Step 3 can
# follow later: with no token set the job logs that it is skipping and exits
# successfully, so merging this before the secret exists does not paint the
# default branch red, and nothing needs to be re-merged once it is added.
#
# One thing is needed on the hub side, and it is not a secret: the hub
# repository needs Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests" ticked. That box
# is off by default. With it off the dispatch still arrives and the receiver
# still runs, but its last step cannot open the bump pull request — so the
# chain dead-ends even with every token here set up correctly.
#
# The hub repository named below is the canonical one; change it if you are
# running your own.

name: Notify hub on merge to main

on:
  push:
    branches: [main]

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the dispatch token
        id: token
        env:
          TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "HUB_DISPATCH_TOKEN is not set; skipping the notification."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      # The payload carries only the submodule path and the commit. The hub
      # resolves everything else itself, so a forged payload cannot talk it
      # into recording a commit that is not on this repository.
      - name: Tell the hub
        if: steps.token.outputs.present == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.HUB_DISPATCH_TOKEN }}
          repository: falorfrozen-cmd/hero-siege-offline-toolkit
          event-type: submodule-updated
          client-payload: >-
            {"submodule": "<submodule-path>", "sha": "${{ github.sha }}"}
